---
- name: List CSRs
  ansible.builtin.command: oc get csr --no-headers
  register: csr_list
  changed_when: false
  failed_when: false

- name: Extract pending CSR names
  ansible.builtin.set_fact:
    pending_csrs: >-
      {{ csr_list.stdout_lines | select('search', 'Pending') |
         map('regex_replace', '^([^ ]+).*', '\\1') | list }}

- name: Display CSR status
  ansible.builtin.debug:
    msg: "Pending CSRs: {{ pending_csrs | default([]) }}"

- name: Automatically approve pending CSRs
  ansible.builtin.command: "oc adm certificate approve {{ item }}"
  loop: "{{ pending_csrs }}"
  when:
    - auto_approve_csrs | bool
    - pending_csrs | length > 0
  changed_when: true

- name: Show manual CSR approval instructions
  ansible.builtin.debug:
    msg:
      - "Pending CSRs exist and auto_approve_csrs=false."
      - "Review every CSR before approval:"
      - "  oc get csr"
      - "  oc describe csr <csr_name>"
      - "Approve valid CSRs:"
      - "  oc adm certificate approve <csr_name>"
      - "After approval, re-run this playbook."
  when:
    - not auto_approve_csrs | bool
    - pending_csrs | length > 0

- name: Stop when manual CSR approval is required
  ansible.builtin.fail:
    msg: >-
      Manual CSR approval required. Approve pending CSRs, then re-run
      playbooks/restore.yml to continue finish_restore.
  when:
    - not auto_approve_csrs | bool
    - pending_csrs | length > 0

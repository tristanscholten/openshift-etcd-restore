---
- name: List CSRs
  ansible.builtin.command: oc get csr --no-headers
  register: csr_list
  changed_when: false
  failed_when: false

- name: Extract pending CSR names
  ansible.builtin.set_fact:
    pending_csrs: >-
      {{ csr_list.stdout_lines | select('search', 'Pending') |
         map('regex_replace', '^([^ ]+).*', '\\1') | list }}

- name: Display CSR status
  ansible.builtin.debug:
    msg: "Pending CSRs: {{ pending_csrs | default([]) }}"

- name: Automatically approve pending CSRs
  ansible.builtin.command: "oc adm certificate approve {{ item }}"
  loop: "{{ pending_csrs }}"
  when:
    - auto_approve_csrs | bool
    - pending_csrs | length > 0
  changed_when: true

- name: Pause for manual CSR approval
  ansible.builtin.pause:
    prompt: >-
      Pending CSRs exist and auto_approve_csrs=false.
      Review and approve CSRs in another terminal:
        oc get csr
        oc describe csr <csr_name>
        oc adm certificate approve <csr_name>
      Press Enter to continue once all CSRs are approved.
  when:
    - not auto_approve_csrs | bool
    - pending_csrs | length > 0

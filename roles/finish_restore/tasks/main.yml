---
- name: Discover OpenShift nodes labeled for etcd restore
  ansible.builtin.command:
    argv:
      - oc
      - get
      - nodes
      - -l
      - "{{ restore_node_label_key }}={{ restore_node_label_value }}"
      - -o
      - 'jsonpath={range .items[*]}{.metadata.name}{"\n"}{end}'
  register: restore_node_label_query
  changed_when: false

- name: Verify exactly one restore node is labeled
  ansible.builtin.assert:
    that:
      - restore_node_label_query.stdout_lines | length == 1
    fail_msg: >-
      Exactly one control-plane node must have the label
      {{ restore_node_label_key }}={{ restore_node_label_value }}. Found
      {{ restore_node_label_query.stdout_lines | length }} labeled nodes:
      {{ restore_node_label_query.stdout_lines | default([]) | join(', ') }}.

- name: Set labeled restore node name
  ansible.builtin.set_fact:
    restore_node_name: "{{ restore_node_label_query.stdout_lines[0] }}"

- name: Verify labeled restore node is a control-plane node
  ansible.builtin.command: >-
    oc get node {{ restore_node_name }}
    -l node-role.kubernetes.io/control-plane
    -o name
  register: restore_node_control_plane_check
  changed_when: false
  failed_when: restore_node_control_plane_check.stdout_lines | length != 1

- name: Initialize restore-node host list
  ansible.builtin.set_fact:
    restore_node_inventory_hosts: []

- name: Match labeled restore node to inventory host
  ansible.builtin.set_fact:
    restore_node_inventory_hosts: "{{ restore_node_inventory_hosts + [item] }}"
  loop: "{{ groups['control_plane'] | default([]) }}"
  when: (hostvars[item].openshift_node_name | default(item)) == restore_node_name

- name: Verify labeled restore node exists once in inventory
  ansible.builtin.assert:
    that:
      - restore_node_inventory_hosts | length == 1
    fail_msg: >-
      The node labeled {{ restore_node_label_key }}={{ restore_node_label_value }}
      is {{ restore_node_name }}, but it does not map to exactly one host in the
      control_plane inventory group. Set openshift_node_name on the matching
      inventory host when the SSH inventory name differs from the OpenShift node
      name.

- name: Set restore-node facts
  ansible.builtin.set_fact:
    restore_node_inventory_hostname: "{{ restore_node_inventory_hosts[0] }}"

- name: Verify etcd container is running on restore node
  ansible.builtin.shell: >-
    set -o pipefail && sudo crictl ps | grep etcd | grep -v operator
  args:
    executable: /bin/bash
  register: restore_node_etcd_container
  changed_when: false
  retries: "{{ restore_wait_retries }}"
  delay: "{{ restore_wait_delay }}"
  until: restore_node_etcd_container.rc == 0
  delegate_to: "{{ restore_node_inventory_hostname }}"

- name: Wait for OpenShift to see restored etcd pods
  ansible.builtin.shell: >-
    set -o pipefail && oc get pods -n {{ etcd_namespace }} |
    grep -v etcd-quorum-guard | grep etcd
  args:
    executable: /bin/bash
  register: etcd_pods_after_restore
  changed_when: false
  retries: "{{ restore_wait_retries }}"
  delay: "{{ restore_wait_delay }}"
  until: etcd_pods_after_restore.rc == 0

- name: Wait for control-plane nodes to become Ready
  block:
    - name: Wait for no NotReady control-plane nodes
      ansible.builtin.shell: >-
        set -o pipefail && oc get nodes
        -l node-role.kubernetes.io/control-plane --no-headers |
        awk '$2 != "Ready" {print $1}'
      args:
        executable: /bin/bash
      register: not_ready_control_plane_nodes
      changed_when: false
      retries: "{{ restore_wait_retries }}"
      delay: "{{ restore_wait_delay }}"
      until: not_ready_control_plane_nodes.stdout_lines | length == 0
  rescue:
    - name: Capture NotReady control-plane nodes after automatic recovery
      ansible.builtin.shell: >-
        set -o pipefail && oc get nodes
        -l node-role.kubernetes.io/control-plane --no-headers |
        awk '$2 != "Ready" {print $1}'
      args:
        executable: /bin/bash
      register: not_ready_control_plane_nodes
      changed_when: false
      failed_when: false

    - name: Show NotReady control-plane diagnostic guidance
      ansible.builtin.debug:
        msg:
          - "Manual intervention required: these control-plane nodes are still NotReady after automatic kubelet certificate recovery and CSR handling:"
          - "{{ not_ready_control_plane_nodes.stdout_lines | default([]) }}"
          - "Start with:"
          - "  oc get nodes -o wide"
          - "  oc describe node <node>"
          - "  oc get csr"
          - "  oc get co"
          - "On the affected host:"
          - "  sudo systemctl status kubelet.service"
          - "  sudo journalctl -u kubelet.service -b --no-pager | tail -200"
          - "  sudo crictl ps -a"
          - "Check host networking/DNS/runtime health and whether the Machine must be replaced."

    - name: Stop for manual NotReady node remediation
      ansible.builtin.fail:
        msg: >-
          Control-plane nodes remain NotReady after automatic kubelet certificate
          recovery. Diagnose and fix the affected hosts manually, then re-run
          playbooks/restore.yml.

- name: Force etcd redeployment
  ansible.builtin.command: >-
    oc patch etcd cluster
    -p={{ {'spec': {'forceRedeploymentReason': 'recovery-' ~ lookup('pipe', 'date --rfc-3339=ns')}} | to_json | quote }}
    --type=merge
  changed_when: true

- name: Force kube-apiserver redeployment
  ansible.builtin.command: >-
    oc patch kubeapiserver cluster
    -p={{ {'spec': {'forceRedeploymentReason': 'recovery-' ~ lookup('pipe', 'date --rfc-3339=ns')}} | to_json | quote }}
    --type=merge
  changed_when: true

- name: Force kube-controller-manager redeployment
  ansible.builtin.command: >-
    oc patch kubecontrollermanager cluster
    -p={{ {'spec': {'forceRedeploymentReason': 'recovery-' ~ lookup('pipe', 'date --rfc-3339=ns')}} | to_json | quote }}
    --type=merge
  changed_when: true

- name: Force kube-scheduler redeployment
  ansible.builtin.command: >-
    oc patch kubescheduler cluster
    -p={{ {'spec': {'forceRedeploymentReason': 'recovery-' ~ lookup('pipe', 'date --rfc-3339=ns')}} | to_json | quote }}
    --type=merge
  changed_when: true

- name: Wait for stable OpenShift cluster operators
  when: finish_restore_wait_for_stable_cluster | bool
  block:
    - name: Wait for cluster operators to stabilise
      ansible.builtin.command:
        argv:
          - oc
          - adm
          - wait-for-stable-cluster
          - --minimum-stable-period
          - "{{ finish_restore_stable_cluster_minimum_period }}"
          - --timeout
          - "{{ finish_restore_stable_cluster_timeout }}"
      changed_when: false
  rescue:
    - name: Gather per-component status on timeout
      ansible.builtin.shell: >-
        set -o pipefail &&
        oc get co etcd kube-apiserver kube-controller-manager kube-scheduler
        --no-headers | awk '{printf "%s: Available=%s Progressing=%s Degraded=%s\n", $1, $3, $4, $5}'
      args:
        executable: /bin/bash
      register: component_status_on_timeout
      changed_when: false
      failed_when: false

    - name: Report per-component rollout status
      ansible.builtin.fail:
        msg: >-
          Control-plane component rollout timed out after {{ finish_restore_stable_cluster_timeout }}.
          Per-component status:
          {{ component_status_on_timeout.stdout | default('unable to retrieve status') }}

- name: Verify all etcd pods are Running
  ansible.builtin.shell: >-
    set -o pipefail && oc get pods -n {{ etcd_namespace }}
    -l app=etcd --no-headers | grep -v Running
  args:
    executable: /bin/bash
  register: etcd_pods_not_running
  changed_when: false
  failed_when: etcd_pods_not_running.stdout_lines | length > 0
  retries: "{{ restore_wait_retries }}"
  delay: "{{ restore_wait_delay }}"
  until: etcd_pods_not_running.rc != 0

- name: Show final verification commands
  ansible.builtin.debug:
    msg:
      - "All etcd pods are Running. Restore complete."
      - "Final checks:"
      - "  oc adm wait-for-stable-cluster"
      - "  oc get nodes -w"
      - "  oc get pods -n openshift-etcd | grep -v etcd-quorum-guard | grep etcd"
      - "  oc get kubeapiserver kubecontrollermanager kubescheduler -o yaml"

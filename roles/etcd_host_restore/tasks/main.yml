---
- name: Require explicit destructive restore confirmation
  ansible.builtin.assert:
    that:
      - restore_i_understand_this_is_destructive | bool
    fail_msg: "Refusing to run destructive etcd restore. Re-run with -e restore_i_understand_this_is_destructive=true after reading README.md."
  run_once: true

- name: Validate derived restore node is in inventory
  ansible.builtin.assert:
    that:
      - restore_node_name in (groups['control_plane'] | map('extract', hostvars, 'openshift_node_name') | list)
    fail_msg: "Derived restore_node_name={{ restore_node_name }} is not in the control_plane inventory."
  run_once: true

- name: Capture restore timestamp
  ansible.builtin.set_fact:
    restore_timestamp: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
  run_once: true

- name: Confirm snapshot exists on restore node
  ansible.builtin.stat:
    path: "{{ restore_host_path }}/{{ restore_snapshot_file }}"
  register: restore_snapshot_stat
  failed_when: not restore_snapshot_stat.stat.exists or restore_snapshot_stat.stat.size | int == 0
  when: restore_node_is_current_host | bool

- name: Copy modified cluster restore script to restore node
  ansible.builtin.copy:
    src: "{{ restore_script_local_path }}"
    dest: "{{ restore_script_remote_path }}"
    owner: root
    group: root
    mode: '0700'
  when: restore_node_is_current_host | bool

- name: Move etcd static pod manifest away on non-restore nodes
  ansible.builtin.command: "mv {{ etcd_static_pod_manifest }} /tmp/etcd-pod.yaml.{{ hostvars[groups['control_plane'][0]].restore_timestamp }}"
  args:
    removes: "{{ etcd_static_pod_manifest }}"
    creates: "/tmp/etcd-pod.yaml.{{ hostvars[groups['control_plane'][0]].restore_timestamp }}"
  when: not restore_node_is_current_host | bool

- name: Wait for etcd static pod container to stop on non-restore nodes
  ansible.builtin.shell: "set -o pipefail && {{ crictl_path }} ps | grep etcd | grep -v operator"
  args:
    executable: /bin/bash
  register: etcd_running
  changed_when: false
  failed_when: false
  retries: 30
  delay: 10
  until: etcd_running.rc != 0
  when: not restore_node_is_current_host | bool

- name: Move kube-apiserver static pod manifest away on non-restore nodes
  ansible.builtin.command: >-
    mv {{ kube_apiserver_static_pod_manifest }}
    /tmp/kube-apiserver-pod.yaml.{{ hostvars[groups['control_plane'][0]].restore_timestamp }}
  args:
    removes: "{{ kube_apiserver_static_pod_manifest }}"
    creates: "/tmp/kube-apiserver-pod.yaml.{{ hostvars[groups['control_plane'][0]].restore_timestamp }}"
  when: not restore_node_is_current_host | bool

- name: Wait for kube-apiserver static pod container to stop on non-restore nodes
  ansible.builtin.shell: "set -o pipefail && {{ crictl_path }} ps | grep kube-apiserver | grep -v operator"
  args:
    executable: /bin/bash
  register: apiserver_running
  changed_when: false
  failed_when: false
  retries: 30
  delay: 10
  until: apiserver_running.rc != 0
  when: not restore_node_is_current_host | bool

- name: Move old etcd data directory aside on non-restore nodes
  ansible.builtin.command: "mv {{ etcd_data_dir }} /tmp/etcd.{{ hostvars[groups['control_plane'][0]].restore_timestamp }}"
  args:
    removes: "{{ etcd_data_dir }}"
    creates: "/tmp/etcd.{{ hostvars[groups['control_plane'][0]].restore_timestamp }}"
  when: not restore_node_is_current_host | bool

- name: Execute modified cluster restore script on restore node
  ansible.builtin.command: "{{ restore_script_remote_path }} {{ restore_host_path }}"
  when: restore_node_is_current_host | bool

- name: Restart kubelet on all control-plane nodes
  ansible.builtin.systemd:
    name: "{{ kubelet_service_name }}"
    state: restarted

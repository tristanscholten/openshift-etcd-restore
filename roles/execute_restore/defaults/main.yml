---
# Kasten restore pod nodeSelector label. The selected restore node must already
# have this label before the destructive host-side restore starts.
restore_node_label_key: etcd-restore
restore_node_label_value: "true"

# Bundled restore script in roles/execute_restore/files/.
restore_script_source: cluster-restore.sh
restore_script_remote_path: /usr/local/bin/cluster-restore.sh

# Fixed OpenShift/Kasten restore staging path.
restore_host_path: /mnt/data

# Fixed control-plane paths/commands used by the OpenShift restore procedure.
static_pod_path: /etc/kubernetes/manifests
etcd_static_pod_manifest: /etc/kubernetes/manifests/etcd-pod.yaml
kube_apiserver_static_pod_manifest: /etc/kubernetes/manifests/kube-apiserver-pod.yaml
etcd_data_dir: /var/lib/etcd
crictl_path: crictl
kubelet_service_name: kubelet.service

# OpenShift static pods can take several minutes to terminate during disaster
# recovery. OpenShift docs show long kube-apiserver stop waits; use 15 minutes.
static_pod_stop_retries: 90
static_pod_stop_delay: 10

# Extra environment passed to cluster-restore.sh. Set proxy variables here when
# the cluster-wide proxy is enabled, matching OpenShift's sudo -E guidance.
restore_script_environment: {}

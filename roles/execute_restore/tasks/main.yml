---
- name: Require explicit destructive restore confirmation
  ansible.builtin.assert:
    that:
      - i_understand_this_is_destructive | bool
    fail_msg: >-
      Refusing to run destructive OpenShift etcd restore. Re-run with
      -e i_understand_this_is_destructive=true only after reading README.md
      and confirming you have console access to all control-plane nodes.
  run_once: true

- name: Discover OpenShift nodes labeled for etcd restore
  ansible.builtin.command:
    argv:
      - oc
      - get
      - nodes
      - -l
      - "{{ restore_node_label_key }}={{ restore_node_label_value }}"
      - -o
      - 'jsonpath={range .items[*]}{.metadata.name}{"\n"}{end}'
  register: restore_node_label_query
  changed_when: false
  become: false
  delegate_to: localhost
  run_once: true

- name: Verify exactly one restore node is labeled
  ansible.builtin.assert:
    that:
      - hostvars[ansible_play_hosts_all[0]].restore_node_label_query.stdout_lines | length == 1
    fail_msg: >-
      Exactly one control-plane node must have the label
      {{ restore_node_label_key }}={{ restore_node_label_value }}. Found
      {{ hostvars[ansible_play_hosts_all[0]].restore_node_label_query.stdout_lines | length }}
      labeled nodes:
      {{ hostvars[ansible_play_hosts_all[0]].restore_node_label_query.stdout_lines |
         default([]) | join(', ') }}.
  run_once: true

- name: Set labeled restore node name
  ansible.builtin.set_fact:
    restore_node_name: >-
      {{ hostvars[ansible_play_hosts_all[0]].restore_node_label_query.stdout_lines[0] }}

- name: Verify labeled restore node is a control-plane node
  ansible.builtin.command: >-
    oc get node {{ restore_node_name }}
    -l node-role.kubernetes.io/master
    -o name
  register: restore_node_control_plane_check
  changed_when: false
  failed_when: restore_node_control_plane_check.stdout_lines | length != 1
  become: false
  delegate_to: localhost
  run_once: true

- name: Initialize restore-node host list
  ansible.builtin.set_fact:
    restore_node_inventory_hosts: []

- name: Match labeled restore node to inventory host
  ansible.builtin.set_fact:
    restore_node_inventory_hosts: "{{ restore_node_inventory_hosts + [item] }}"
  loop: "{{ groups['control_plane'] | default([]) }}"
  when: (hostvars[item].openshift_node_name | default(item)) == restore_node_name

- name: Verify labeled restore node exists once in inventory
  ansible.builtin.assert:
    that:
      - restore_node_inventory_hosts | length == 1
    fail_msg: >-
      The node labeled {{ restore_node_label_key }}={{ restore_node_label_value }}
      is {{ restore_node_name }}, but it does not map to exactly one host in the
      control_plane inventory group. Set openshift_node_name on the matching
      inventory host when the SSH inventory name differs from the OpenShift node
      name.
  run_once: true

- name: Set restore-node facts
  ansible.builtin.set_fact:
    restore_node_inventory_hostname: "{{ restore_node_inventory_hosts[0] }}"
    restore_node_is_current_host: "{{ inventory_hostname == restore_node_inventory_hosts[0] }}"

- name: Capture restore timestamp
  ansible.builtin.set_fact:
    restore_timestamp: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
  run_once: true

- name: Verify snapshot exists on restore node
  ansible.builtin.stat:
    path: "{{ restore_host_path }}/{{ restore_snapshot_file }}"
  register: restore_snapshot_stat
  failed_when: >-
    not restore_snapshot_stat.stat.exists or
    restore_snapshot_stat.stat.size | int == 0
  when: restore_node_is_current_host | bool

- name: Copy restore script to restore node over SSH
  ansible.builtin.copy:
    src: "{{ restore_script_source }}"
    dest: "{{ restore_script_remote_path }}"
    owner: root
    group: root
    mode: '0700'
  when: restore_node_is_current_host | bool

- name: Move etcd static pod manifest away on non-restore nodes
  ansible.builtin.command: >-
    mv {{ etcd_static_pod_manifest }}
    /tmp/etcd-pod.yaml.{{ hostvars[groups['control_plane'][0]].restore_timestamp }}
  args:
    removes: "{{ etcd_static_pod_manifest }}"
    creates: "/tmp/etcd-pod.yaml.{{ hostvars[groups['control_plane'][0]].restore_timestamp }}"
  when: not restore_node_is_current_host | bool

- name: Wait for etcd static pod containers to stop on non-restore nodes
  ansible.builtin.shell: >-
    set -o pipefail && {{ crictl_path }} ps | grep etcd | grep -v operator
  args:
    executable: /bin/bash
  register: etcd_container_check
  changed_when: false
  failed_when: false
  retries: 30
  delay: 10
  until: etcd_container_check.rc != 0
  when: not restore_node_is_current_host | bool

- name: Move kube-apiserver static pod manifest away on non-restore nodes
  ansible.builtin.command: >-
    mv {{ kube_apiserver_static_pod_manifest }}
    /tmp/kube-apiserver-pod.yaml.{{ hostvars[groups['control_plane'][0]].restore_timestamp }}
  args:
    removes: "{{ kube_apiserver_static_pod_manifest }}"
    creates: "/tmp/kube-apiserver-pod.yaml.{{ hostvars[groups['control_plane'][0]].restore_timestamp }}"
  when: not restore_node_is_current_host | bool

- name: Wait for kube-apiserver static pod containers to stop on non-restore nodes
  ansible.builtin.shell: >-
    set -o pipefail && {{ crictl_path }} ps | grep kube-apiserver | grep -v operator
  args:
    executable: /bin/bash
  register: kube_apiserver_container_check
  changed_when: false
  failed_when: false
  retries: 30
  delay: 10
  until: kube_apiserver_container_check.rc != 0
  when: not restore_node_is_current_host | bool

- name: Move old etcd data directory aside on non-restore nodes
  ansible.builtin.command: >-
    mv {{ etcd_data_dir }}
    /tmp/etcd.{{ hostvars[groups['control_plane'][0]].restore_timestamp }}
  args:
    removes: "{{ etcd_data_dir }}"
    creates: "/tmp/etcd.{{ hostvars[groups['control_plane'][0]].restore_timestamp }}"
  when: not restore_node_is_current_host | bool

- name: Run modified cluster restore script on restore node
  ansible.builtin.command: "{{ restore_script_remote_path | basename }} {{ restore_host_path }}"
  environment:
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  when: restore_node_is_current_host | bool

- name: Restart kubelet on all control-plane nodes
  ansible.builtin.systemd:
    name: "{{ kubelet_service_name }}"
    state: restarted

- name: Restore execution stopped before CSR approval
  ansible.builtin.debug:
    msg: >-
      Host-side restore completed through kubelet restart. Continue with CSR
      approval before the finishing role forces control-plane redeployments.
  run_once: true

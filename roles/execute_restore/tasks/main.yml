---
- name: Display destructive operation warning
  ansible.builtin.debug:
    msg: >-
      WARNING: This operation is destructive. It will restore the etcd cluster
      to a previous state and may result in loss of recent changes. Ensure you
      have read README.md and have console access to all control-plane nodes.
  run_once: true

- name: Require explicit destructive restore confirmation
  ansible.builtin.assert:
    that:
      - i_understand_this_is_destructive | bool
    fail_msg: >-
      Refusing to run: this operation is destructive, will restore etcd to a
      previous state, and may result in loss of recent changes. Re-run with
      -e i_understand_this_is_destructive=true only after reading README.md
      and confirming you have console access to all control-plane nodes.
  run_once: true

- name: Display guidance for lost control-plane machines
  ansible.builtin.debug:
    msg:
      - "NOTE: If non-restore control-plane machines were lost, they may need to be"
      - "manually deleted and recreated. This step is NOT automated by this playbook."
      - "Do not delete or recreate the restore-node Machine."
      - "For Machine API clusters, delete the old Machine resource and create a new one."
      - >-
        See: https://docs.openshift.com/container-platform/latest/backup_and_restore/
        control_plane_backup_and_restore/disaster_recovery/
        scenario-2-restoring-cluster-state.html
  run_once: true

- name: Discover OpenShift nodes labeled for etcd restore
  ansible.builtin.command:
    argv:
      - oc
      - get
      - nodes
      - -l
      - "{{ restore_node_label_key }}={{ restore_node_label_value }}"
      - -o
      - 'jsonpath={range .items[*]}{.metadata.name}{"\n"}{end}'
  register: restore_node_label_query
  changed_when: false
  become: false
  delegate_to: localhost

- name: Verify exactly one restore node is labeled
  ansible.builtin.assert:
    that:
      - restore_node_label_query.stdout_lines | length == 1
    fail_msg: >-
      Exactly one control-plane node must have the label
      {{ restore_node_label_key }}={{ restore_node_label_value }}. Found
      {{ restore_node_label_query.stdout_lines | length }} labeled nodes:
      {{ restore_node_label_query.stdout_lines | default([]) | join(', ') }}.

- name: Set labeled restore node name
  ansible.builtin.set_fact:
    restore_node_name: "{{ restore_node_label_query.stdout_lines[0] }}"

- name: Verify labeled restore node is a control-plane node
  ansible.builtin.command: >-
    oc get node {{ restore_node_name }}
    -l node-role.kubernetes.io/control-plane
    -o name
  register: restore_node_control_plane_check
  changed_when: false
  failed_when: restore_node_control_plane_check.stdout_lines | length != 1
  become: false
  delegate_to: localhost

- name: Initialize restore-node host list
  ansible.builtin.set_fact:
    restore_node_inventory_hosts: []

- name: Match labeled restore node to inventory host
  ansible.builtin.set_fact:
    restore_node_inventory_hosts: "{{ restore_node_inventory_hosts + [item] }}"
  loop: "{{ groups['control_plane'] | default([]) }}"
  when: (hostvars[item].openshift_node_name | default(item)) == restore_node_name

- name: Verify labeled restore node exists once in inventory
  ansible.builtin.assert:
    that:
      - restore_node_inventory_hosts | length == 1
    fail_msg: >-
      The node labeled {{ restore_node_label_key }}={{ restore_node_label_value }}
      is {{ restore_node_name }}, but it does not map to exactly one host in the
      control_plane inventory group. Set openshift_node_name on the matching
      inventory host when the SSH inventory name differs from the OpenShift node
      name.
  run_once: true

- name: Set restore-node facts
  ansible.builtin.set_fact:
    restore_node_inventory_hostname: "{{ restore_node_inventory_hosts[0] }}"
    restore_node_is_current_host: "{{ inventory_hostname == restore_node_inventory_hosts[0] }}"

- name: Capture restore timestamp
  ansible.builtin.set_fact:
    restore_timestamp: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"

- name: Verify snapshot exists on restore node
  ansible.builtin.stat:
    path: "{{ restore_host_path }}/{{ restore_snapshot_file }}"
  register: restore_snapshot_stat
  failed_when: >-
    not restore_snapshot_stat.stat.exists or
    restore_snapshot_stat.stat.size | int == 0
  when: restore_node_is_current_host | bool

- name: Copy restore script to restore node over SSH
  ansible.builtin.copy:
    src: "{{ restore_script_path | basename }}"
    dest: "{{ restore_script_path }}"
    owner: root
    group: root
    mode: '0700'
  when: restore_node_is_current_host | bool

- name: Move etcd static pod manifest away on non-restore nodes
  ansible.builtin.command: >-
    mv /etc/kubernetes/manifests/etcd-pod.yaml
    /tmp/etcd-pod.yaml.{{ restore_timestamp }}
  args:
    removes: /etc/kubernetes/manifests/etcd-pod.yaml
    creates: "/tmp/etcd-pod.yaml.{{ restore_timestamp }}"
  when: not restore_node_is_current_host | bool

- name: Wait for etcd static pod containers to stop on non-restore nodes
  ansible.builtin.shell: >-
    set -o pipefail && crictl ps | grep etcd | grep -v operator
  args:
    executable: /bin/bash
  register: etcd_container_check
  changed_when: false
  failed_when: false
  retries: "{{ restore_wait_retries }}"
  delay: "{{ restore_wait_delay }}"
  until: etcd_container_check.rc != 0
  when: not restore_node_is_current_host | bool

- name: Move kube-apiserver static pod manifest away on non-restore nodes
  ansible.builtin.command: >-
    mv /etc/kubernetes/manifests/kube-apiserver-pod.yaml
    /tmp/kube-apiserver-pod.yaml.{{ restore_timestamp }}
  args:
    removes: /etc/kubernetes/manifests/kube-apiserver-pod.yaml
    creates: "/tmp/kube-apiserver-pod.yaml.{{ restore_timestamp }}"
  when: not restore_node_is_current_host | bool

- name: Wait for kube-apiserver static pod containers to stop on non-restore nodes
  ansible.builtin.shell: >-
    set -o pipefail && crictl ps | grep kube-apiserver | grep -v operator
  args:
    executable: /bin/bash
  register: kube_apiserver_container_check
  changed_when: false
  failed_when: false
  retries: "{{ restore_wait_retries }}"
  delay: "{{ restore_wait_delay }}"
  until: kube_apiserver_container_check.rc != 0
  when: not restore_node_is_current_host | bool

- name: Move old etcd data directory aside on non-restore nodes
  ansible.builtin.command: >-
    mv /var/lib/etcd
    /tmp/etcd.{{ restore_timestamp }}
  args:
    removes: /var/lib/etcd
    creates: "/tmp/etcd.{{ restore_timestamp }}"
  when: not restore_node_is_current_host | bool

- name: Run modified cluster restore script on restore node
  ansible.builtin.command: "{{ restore_script_path }} {{ restore_host_path }}"
  when: restore_node_is_current_host | bool

- name: Restart kubelet on all control-plane nodes
  ansible.builtin.systemd:
    name: kubelet.service
    state: restarted

- name: Ensure kubelet is running on all control-plane nodes
  block:
    - name: Gather service facts before kubelet check
      ansible.builtin.service_facts:

    - name: Start kubelet when it is not running
      ansible.builtin.systemd:
        name: kubelet.service
        state: started
        enabled: true
      when: >-
        ansible_facts.services['kubelet.service'] is not defined or
        ansible_facts.services['kubelet.service'].state != 'running'

    - name: Gather service facts after kubelet start
      ansible.builtin.service_facts:

    - name: Verify kubelet is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['kubelet.service'] is defined
          - ansible_facts.services['kubelet.service'].state == 'running'
        fail_msg: kubelet.service is not running after automatic start attempt.
  rescue:
    - name: Collect kubelet diagnostics after failed automatic start
      ansible.builtin.shell: journalctl -u kubelet.service -b --no-pager | tail -200
      args:
        executable: /bin/bash
      register: kubelet_journal_tail
      changed_when: false
      failed_when: false

    - name: Show kubelet start diagnostic guidance
      ansible.builtin.debug:
        msg:
          - "Manual intervention required: kubelet.service is not running on {{ inventory_hostname }}."
          - "The playbook tried to start and enable kubelet.service automatically, but it is still not active."
          - "Check on the affected host:"
          - "  sudo systemctl status kubelet.service"
          - "  sudo journalctl -u kubelet.service -b --no-pager | tail -200"
          - "Recent kubelet journal lines captured by the playbook:"
          - "{{ kubelet_journal_tail.stdout_lines | default([]) }}"

    - name: Stop for manual kubelet remediation
      ansible.builtin.fail:
        msg: >-
          kubelet.service is not running on {{ inventory_hostname }} after an
          automatic start attempt. Fix kubelet manually, then re-run
          playbooks/restore.yml.

- name: Check node readiness after kubelet restart
  ansible.builtin.command:
    argv:
      - oc
      - get
      - node
      - "{{ hostvars[inventory_hostname].openshift_node_name | default(inventory_hostname) }}"
      - -o
      - 'jsonpath={range .status.conditions[?(@.type=="Ready")]}{.status}{end}'
  register: node_ready_after_kubelet_restart
  changed_when: false
  failed_when: false
  become: false
  delegate_to: localhost
  retries: 12
  delay: 10
  until: node_ready_after_kubelet_restart.rc == 0

- name: Remove kubelet client certificates on NotReady control-plane nodes
  ansible.builtin.shell: rm -f /var/lib/kubelet/pki/*.pem
  args:
    executable: /bin/bash
  when:
    - node_ready_after_kubelet_restart.rc == 0
    - node_ready_after_kubelet_restart.stdout | trim != 'True'

- name: Restart kubelet after certificate cleanup on recovered nodes
  ansible.builtin.systemd:
    name: kubelet.service
    state: restarted
  when:
    - node_ready_after_kubelet_restart.rc == 0
    - node_ready_after_kubelet_restart.stdout | trim != 'True'

- name: Wait for kubelet CSRs after certificate cleanup
  ansible.builtin.pause:
    seconds: 30
  when:
    - node_ready_after_kubelet_restart.rc == 0
    - node_ready_after_kubelet_restart.stdout | trim != 'True'

- name: Restore execution stopped before CSR approval
  ansible.builtin.debug:
    msg: >-
      Host-side restore completed through kubelet restart. Continue with CSR
      approval before the finishing role forces control-plane redeployments.
  run_once: true

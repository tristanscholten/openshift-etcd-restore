---
- name: Set restore-node inventory host from prior restore discovery
  ansible.builtin.set_fact:
    validate_restore_node_inventory_hostname: "{{ restore_node_inventory_hostname }}"
  when: restore_node_inventory_hostname is defined

- name: Set restore-node inventory host for single-node inventory
  ansible.builtin.set_fact:
    validate_restore_node_inventory_hostname: "{{ groups['control_plane'][0] }}"
  when:
    - validate_restore_node_inventory_hostname is not defined
    - groups['control_plane'] | default([]) | length == 1

- name: Verify no pending CSRs remain
  ansible.builtin.shell: >-
    set -o pipefail &&
    oc get csr --no-headers 2>/dev/null |
    awk '$0 ~ /Pending/ { print $1 }'
  args:
    executable: /bin/bash
  register: validate_restore_pending_csrs
  changed_when: false
  failed_when: validate_restore_pending_csrs.stdout_lines | length > 0
  retries: "{{ restore_wait_retries }}"
  delay: "{{ restore_wait_delay }}"
  until: validate_restore_pending_csrs.stdout_lines | length == 0

- name: Verify all control-plane nodes are Ready
  ansible.builtin.shell: >-
    set -o pipefail &&
    oc get nodes -l node-role.kubernetes.io/control-plane --no-headers |
    awk '$2 != "Ready" { print $1 " " $2 }'
  args:
    executable: /bin/bash
  register: validate_restore_not_ready_control_plane_nodes
  changed_when: false
  failed_when: validate_restore_not_ready_control_plane_nodes.stdout_lines | length > 0
  retries: "{{ restore_wait_retries }}"
  delay: "{{ restore_wait_delay }}"
  until: validate_restore_not_ready_control_plane_nodes.stdout_lines | length == 0

- name: Verify control-plane ClusterOperators are healthy
  ansible.builtin.shell: >-
    set -o pipefail &&
    oc get co {{ validate_restore_clusteroperators | join(' ') }} --no-headers |
    awk '$3 != "True" || $4 != "False" || $5 != "False" {
      printf "%s Available=%s Progressing=%s Degraded=%s\n", $1, $3, $4, $5;
      bad=1
    } END { exit bad }'
  args:
    executable: /bin/bash
  register: validate_restore_clusteroperator_status
  changed_when: false
  retries: "{{ restore_wait_retries }}"
  delay: "{{ restore_wait_delay }}"
  until: validate_restore_clusteroperator_status.rc == 0

- name: Verify etcd pods are present, Ready, and Running
  ansible.builtin.shell: >-
    set -o pipefail &&
    oc get pods -n {{ etcd_namespace }} -l app=etcd --no-headers |
    awk '
      $0 !~ /etcd-quorum-guard/ {
        count++;
        split($2, ready, "/");
        if (ready[1] != ready[2] || $3 != "Running") {
          print $0;
          bad=1
        }
      }
      END { if (count == 0) { print "no etcd pods found"; bad=1 } exit bad }'
  args:
    executable: /bin/bash
  register: validate_restore_etcd_pods
  changed_when: false
  retries: "{{ restore_wait_retries }}"
  delay: "{{ restore_wait_delay }}"
  until: validate_restore_etcd_pods.rc == 0

- name: Verify etcd endpoints ConfigMap has routable addresses
  ansible.builtin.shell: >-
    set -o pipefail &&
    oc -n {{ etcd_namespace }} get configmap etcd-endpoints
    -o go-template='{% raw %}{{range $k,$v := .data}}{{printf "%s=%s\n" $k $v}}{{end}}{% endraw %}' |
    awk -F= '$2 == "localhost" || $2 == "127.0.0.1" || $2 == "::1" { print; bad=1 }
    END { exit bad }'
  args:
    executable: /bin/bash
  register: validate_restore_etcd_endpoint_addresses
  changed_when: false
  when: validate_restore_check_etcd_endpoint_addresses | bool

- name: Verify live etcd member peer URLs are routable
  ansible.builtin.shell: |
    set -euo pipefail
    etcdctl_container=$(sudo crictl ps --name etcdctl -q | head -1)
    test -n "${etcdctl_container}"
    sudo crictl exec "${etcdctl_container}" etcdctl member list |
      awk -F, '
        {
          id=$1
          name=$3
          peer=$4
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", id)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", peer)
          if (peer ~ /localhost|127\.0\.0\.1|\[::1\]/) {
            print id " " name " " peer
            bad=1
          }
        }
        END { exit bad }'
  args:
    executable: /bin/bash
  register: validate_restore_etcd_member_urls
  changed_when: false
  delegate_to: "{{ validate_restore_node_inventory_hostname }}"
  when:
    - validate_restore_check_etcd_member_urls | bool
    - validate_restore_node_inventory_hostname is defined

- name: Show restore validation summary
  ansible.builtin.debug:
    msg:
      - "Restore validation passed."
      - "Control-plane nodes are Ready."
      - "Pending CSRs: none."
      - "ClusterOperators healthy: {{ validate_restore_clusteroperators | join(', ') }}."
      - "Etcd pods are Running."
      - "Etcd endpoint addresses are routable."

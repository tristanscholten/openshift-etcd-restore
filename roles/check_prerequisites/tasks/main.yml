---
- name: Discover OpenShift nodes labeled for etcd restore
  ansible.builtin.command:
    argv:
      - oc
      - get
      - nodes
      - -l
      - "{{ restore_node_label_key }}={{ restore_node_label_value }}"
      - -o
      - 'jsonpath={range .items[*]}{.metadata.name}{"\n"}{end}'
  register: restore_node_label_query
  changed_when: false

- name: Verify exactly one restore node is labeled
  ansible.builtin.assert:
    that:
      - restore_node_label_query.stdout_lines | length == 1
    fail_msg: >-
      Exactly one control-plane node must have the label
      {{ restore_node_label_key }}={{ restore_node_label_value }}. Found
      {{ restore_node_label_query.stdout_lines | length }} labeled nodes:
      {{ restore_node_label_query.stdout_lines | default([]) | join(', ') }}.

- name: Set labeled restore node name
  ansible.builtin.set_fact:
    restore_node_name: "{{ restore_node_label_query.stdout_lines[0] }}"

- name: Verify labeled restore node is a control-plane node
  ansible.builtin.shell: >-
    set -o pipefail &&
    oc get nodes -l node-role.kubernetes.io/control-plane -o name |
    grep -Fx node/{{ restore_node_name }}
  args:
    executable: /bin/bash
  register: restore_node_control_plane_check
  changed_when: false
  failed_when: restore_node_control_plane_check.stdout_lines | length != 1

- name: Initialize restore-node host list
  ansible.builtin.set_fact:
    restore_node_inventory_hosts: []

- name: Match labeled restore node to inventory host
  ansible.builtin.set_fact:
    restore_node_inventory_hosts: "{{ restore_node_inventory_hosts + [item] }}"
  loop: "{{ groups['control_plane'] | default([]) }}"
  when: (hostvars[item].openshift_node_name | default(item)) == restore_node_name

- name: Verify labeled restore node exists once in inventory
  ansible.builtin.assert:
    that:
      - groups['control_plane'] | default([]) | length > 0
      - restore_node_inventory_hosts | length == 1
    fail_msg: >-
      The node labeled {{ restore_node_label_key }}={{ restore_node_label_value }}
      is {{ restore_node_name }}, but it does not map to exactly one host in the
      control_plane inventory group. Set openshift_node_name on the matching
      inventory host when the SSH inventory name differs from the OpenShift node
      name.

- name: Set restore-node facts
  ansible.builtin.set_fact:
    restore_node_inventory_hostname: "{{ restore_node_inventory_hosts[0] }}"

- name: Verify required local commands exist
  ansible.builtin.command: "bash -lc 'command -v {{ item }}'"
  changed_when: false
  loop:
    - oc
    - ansible-playbook

- name: Verify OpenShift login
  ansible.builtin.command: oc whoami
  changed_when: false

- name: Verify cluster-admin privileges
  ansible.builtin.command: oc auth can-i '*' '*'
  register: cluster_admin_check
  changed_when: false
  failed_when: cluster_admin_check.stdout | trim != 'yes'

- name: Verify OpenShift etcd namespace exists
  ansible.builtin.command: "oc get namespace {{ etcd_namespace }} -o name"
  changed_when: false

- name: Verify Kasten namespace exists
  ansible.builtin.command: "oc get namespace {{ kasten_namespace }} -o name"
  changed_when: false
  when: restore_require_kasten_download_prerequisites | bool

- name: Verify etcd pods are discoverable
  ansible.builtin.command: >-
    oc get pods -n {{ etcd_namespace }} -l app=etcd,etcd=true -o name
  register: etcd_pod_check
  changed_when: false
  failed_when: etcd_pod_check.stdout_lines | length == 0

- name: Verify inventory control-plane hosts exist in OpenShift
  ansible.builtin.command: >-
    oc get node {{ hostvars[item].openshift_node_name | default(item) }} -o name
  changed_when: false
  loop: "{{ groups['control_plane'] }}"

- name: Verify restore script exists on controller
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../roles/execute_restore/files/cluster-restore.sh"
  register: restore_script_local_stat
  failed_when: not restore_script_local_stat.stat.exists

- name: Verify SSH, sudo, crictl, and static-pod path on control-plane nodes
  ansible.builtin.raw: >-
    sudo -n true && command -v crictl && test -d /etc/kubernetes/manifests && test -d /usr/local/bin
  changed_when: false
  delegate_to: "{{ item }}"
  loop: "{{ groups['control_plane'] }}"

- name: Ensure restore host path exists on restore node
  ansible.builtin.file:
    path: "{{ restore_host_path }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  become: true
  delegate_to: "{{ restore_node_inventory_hostname }}"

- name: Verify Kasten restore namespace exists
  ansible.builtin.command: "oc get namespace {{ etcd_restore_namespace }} -o name"
  changed_when: false
  when: restore_require_kasten_download_prerequisites | bool

- name: Verify restore PersistentVolume exists
  ansible.builtin.command: "oc get pv {{ restore_pv_name }} -o name"
  changed_when: false
  when: restore_require_kasten_download_prerequisites | bool

- name: Verify restore PersistentVolume host path
  ansible.builtin.command: >-
    oc get pv {{ restore_pv_name }}
    -o jsonpath='{.spec.hostPath.path}'
  register: restore_pv_host_path
  changed_when: false
  failed_when: restore_pv_host_path.stdout | trim != restore_host_path
  when: restore_require_kasten_download_prerequisites | bool

- name: Verify restore PersistentVolumeClaim exists
  ansible.builtin.command: >-
    oc get pvc {{ restore_pvc_name }} -n {{ etcd_restore_namespace }} -o name
  changed_when: false
  when: restore_require_kasten_download_prerequisites | bool

- name: Verify restore PVC is bound
  ansible.builtin.command: >-
    oc get pvc {{ restore_pvc_name }} -n {{ etcd_restore_namespace }}
    -o jsonpath='{.status.phase}'
  register: restore_pvc_phase
  changed_when: false
  failed_when: restore_pvc_phase.stdout != 'Bound'
  when: restore_require_kasten_download_prerequisites | bool

- name: Show required Kasten restore-download step
  ansible.builtin.debug:
    msg:
      - "Kasten target is prepared. If the backup file is not present yet, run the restore action in Veeam Kasten now."
      - "Target namespace: {{ etcd_restore_namespace }}"
      - "Restore node label: {{ restore_node_label_key }}={{ restore_node_label_value }}"
      - "Expected backup on restore node: {{ restore_host_path }}/{{ restore_snapshot_file }}"
      - "Kanister Blueprint restore phase note follows exactly from the Kasten documentation."
      - "# This phase is not actualy performing restore of the etcd data store but is used"
      - "# to copy backup data to one of the leader nodes. It spins a pod on a leader node"
      - "# having label etcd-restore. The pod is used to download the backup file from the"
      - "# object store and copy it to the /mnt/data location of the PV mapped to PVC pvc-etcd."
      - "# The PV's mount path is /mnt/data on leader node where the cluster-ocp-restore.sh"
      - "# script would be executed."
  when: restore_require_kasten_download_prerequisites | bool

- name: Verify downloaded etcd backup exists on restore node
  ansible.builtin.stat:
    path: "{{ restore_host_path }}/{{ restore_snapshot_file }}"
  register: restored_snapshot_stat
  delegate_to: "{{ restore_node_inventory_hostname }}"
  failed_when: >-
    not restored_snapshot_stat.stat.exists or
    restored_snapshot_stat.stat.size | int == 0

- name: Confirm prerequisites are ready
  ansible.builtin.debug:
    msg: >-
      Prerequisites are ready. Restore node {{ restore_node_name }} has
      {{ restore_host_path }}/{{ restore_snapshot_file }} with size
      {{ restored_snapshot_stat.stat.size }} bytes.

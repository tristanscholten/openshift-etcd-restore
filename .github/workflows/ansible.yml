---
name: Ansible

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Ansible tooling
        run: python -m pip install --upgrade ansible-core ansible-lint

      - name: Run syntax checks
        run: |
          for playbook in playbooks/*.yml; do
            ansible-playbook -i inventories/example/hosts.yml "$playbook" --syntax-check
          done

      - name: Run ansible-lint
        run: ansible-lint --profile moderate .

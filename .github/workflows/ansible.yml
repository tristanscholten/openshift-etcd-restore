---
name: Ansible

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Ansible
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Ansible tooling
        run: python -m pip install --upgrade ansible-core ansible-lint

      - name: Run syntax check
        run: ansible-playbook -i inventories/example/hosts.yml playbooks/restore.yml --syntax-check

      - name: Run ansible-lint
        run: ansible-lint --profile moderate .

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix (for example 1.2.3)
        required: true
        type: string
      image:
        description: Optional already-published image; must end in :v<version>
        required: false
        type: string
      dry_run:
        description: Validate only; set false to create the annotated tag and GitHub release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release input and source branch
        env:
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch --tags --force
          ! git rev-parse -q --verify "refs/tags/v$VERSION"
          if [ -n "$IMAGE" ]; then
            test "${IMAGE##*:}" = "v$VERSION"
            docker manifest inspect "$IMAGE" >/dev/null
          fi
      - name: Create immutable annotated tag and GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes --title "v$VERSION"

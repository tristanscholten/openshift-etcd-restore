---
# Set this to true only when you are ready to run the destructive host-side
# etcd restore operations.
i_understand_this_is_destructive: false

# If true, approve all pending CSRs automatically after the host restore.
# If false, the playbook prints the exact manual CSR commands and stops when
# pending CSRs exist.
auto_approve_csrs: false

# Kasten/OpenShift namespaces and objects.
kasten_namespace: kasten-io
etcd_namespace: openshift-etcd
etcd_restore_namespace: etcd-restore
restore_node_label_key: etcd-restore
restore_node_label_value: "true"

# PV/PVC used by the Kanister restore action to place the backup on the
# selected restore node.
restore_snapshot_file: etcd-backup.db
restore_pv_name: pv-etcd
restore_pvc_name: pvc-etcd
restore_storage_class: default
restore_storage_size: 10Gi

# Control-plane host paths and commands.
static_pod_path: /etc/kubernetes/manifests
etcd_static_pod_manifest: /etc/kubernetes/manifests/etcd-pod.yaml
kube_apiserver_static_pod_manifest: /etc/kubernetes/manifests/kube-apiserver-pod.yaml
etcd_data_dir: /var/lib/etcd
crictl_path: crictl
kubelet_service_name: kubelet.service
